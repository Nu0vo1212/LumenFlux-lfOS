# =============================================================================
#  lfOS (LumenFluxOS / 流光OS) 防火墙规则
#  对应设计方案 Phase 5：默认拒绝入站，仅放行明确需要的端口
#
#  设计原则：
#    - 默认 DROP（白名单模型，而非黑名单）
#    - 状态跟踪：已建立/相关连接放行
#    - 关闭 forward（lfOS 是服务器，不是路由器）
#    - 显式丢弃无效包，减少扫描面
# =============================================================================

#!/usr/sbin/nft -f

# 清空既有规则（幂等：可重复应用）
flush ruleset

table inet lfos_filter {
    # ---------------------------------------------------------------------
    # 具名集合：便于集中管理放行端口
    # ---------------------------------------------------------------------
    set tcp_accept_ports {
        type inet_service
        flags interval
        elements = { 22 }        # SSH；业务端口按需追加（443、80、5432 …）
    }

    # ---------------------------------------------------------------------
    # 入站：默认拒绝
    # ---------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # 1) 已建立连接与相关流量（状态跟踪）
        ct state established,related accept

        # 2) 无效包直接丢弃并计数（便于发现扫描/畸形包）
        ct state invalid counter drop

        # 3) 回环口完全信任
        iif "lo" accept

        # 4) ICMP：放行必要的诊断类型，但限制速率，避免被用于放大攻击
        ip protocol icmp icmp type {
            destination-unreachable, time-exceeded, parameter-problem,
            echo-request
        } accept
        ip6 nexthdr icmpv6 icmpv6 type {
            destination-unreachable, packet-too-big, time-exceeded,
            parameter-problem, nd-router-advert, nd-neighbor-solicit,
            nd-neighbor-advert, echo-request
        } accept

        # 5) IPv6 邻居发现（必须，否则 IPv6 不可用）
        ip6 nexthdr icmpv6 icmpv6 type { nd-router-solicit } accept

        # 6) 明确放行的 TCP 端口（带速率限制，防暴力破解）
        tcp dport @tcp_accept_ports ct state new \
            limit rate 20/minute burst 10 packets \
            counter accept

        # 7) 其余全部丢弃并计数（便于审计）
        counter drop
    }

    # ---------------------------------------------------------------------
    # 转发：lfOS 不做路由器
    # ---------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;
        counter drop
    }

    # ---------------------------------------------------------------------
    # 出站：默认放行（服务器需主动出网更新/调用外部服务）
    # ---------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
