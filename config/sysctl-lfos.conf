# =============================================================================
#  lfOS (LumenFluxOS / 流光OS) 运行时内核参数
#  由 /init 在启动早期通过 sysctl -p 应用
#
#  分三部分：
#    [安全] 按 KSPP / CIS 基线收紧信息暴露面
#    [性能] 按服务器吞吐取向调优（与内核编译期配置互补）
#    [占用] 控制内存回收与缓存行为
# =============================================================================

# -----------------------------------------------------------------------------
# 一、安全加固（运行时）
# -----------------------------------------------------------------------------

# 内核指针地址隐藏：非 root 看不到内核符号地址，抬高 KASLR 绕过成本
kernel.kptr_restrict = 1

# dmesg 仅 root 可读（编译期已设 DMESG_RESTRICT，这里双保险）
kernel.dmesg_restrict = 1

# perf 事件限制：>=3 表示普通用户完全不能使用 perf 采样
kernel.perf_event_paranoid = 3

# 禁用 SysRq 的敏感功能，仅保留必要的（如需完全禁用作 0）
kernel.sysrq = 16

# 禁止非特权用户使用 BPF（减少内核攻击面）
kernel.unprivileged_bpf_disabled = 1

# 禁止非特权用户命名空间（容器逃逸常见入口；如需容器再放开）
kernel.unprivileged_userns_clone = 0

# 内核 panic 后自动重启的等待时间；0 表示不自动重启（服务器由带外管理处理）
kernel.panic = 0

# 内核指针/符号泄漏防护
kernel.kptr_restrict = 1

# 限制核心转储中的敏感信息
fs.suid_dumpable = 0

# -----------------------------------------------------------------------------
# 二、网络加固 + 性能
# -----------------------------------------------------------------------------

# --- 反欺骗 / 反扫描 ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.tcp_syncookies = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# --- 性能：连接与缓冲 ---
# 半连接/全连接队列（高并发入口）
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
# TIME_WAIT 复用（客户端密集场景收益明显）
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
# 端口范围放宽
net.ipv4.ip_local_port_range = 10240 65535
# 收发缓冲（10Gbps 以内通用值）
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216
# 全局队列积压上限
net.core.netdev_max_backlog = 8192
# 已建立的连接队列
net.ipv4.tcp_max_tw_buckets = 262144
# 快速回收与拥塞控制（内核已默认 BBR + fq，这里显式确认）
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
# 开启 MTU 探测与选择性确认
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_fack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
# 慢启动重启
net.ipv4.tcp_slow_start_after_idle = 0
# 减少 TIME_WAIT 时的内存占用
net.ipv4.tcp_max_orphans = 32768
# keepalive（服务器长连接保活）
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 9
# 转发（如需做网关/容器再打开）
net.ipv4.ip_forward = 0

# -----------------------------------------------------------------------------
# 三、内存与文件系统（低占用 + 性能平衡）
# -----------------------------------------------------------------------------

# 内存不足时适度使用交换（云主机无 swap 时此值无影响）
vm.swappiness = 10
# 脏页回写：避免突发 IO 尖峰
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
# 内存过量提交（数据库/JVM 场景常用 1；服务器默认 0 更安全）
vm.overcommit_memory = 0
# 文件句柄与进程上限
fs.file-max = 2097152
fs.nr_open = 1048576
# inotify（服务监控常用）
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
# 减少交换倾向、提升缓存利用
vm.vfs_cache_pressure = 50
# 最大 map 数量（大型 JVM/数据库需要）
vm.max_map_count = 262144
